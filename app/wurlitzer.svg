<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wood" x1="0" x2="1">
      <stop offset="0" stop-color="#3b1a0c"/><stop offset=".25" stop-color="#7a3b18"/>
      <stop offset=".5" stop-color="#9a5226"/><stop offset=".75" stop-color="#7a3b18"/><stop offset="1" stop-color="#3b1a0c"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff2d1a"/><stop offset=".35" stop-color="#ff8a00"/>
      <stop offset=".7" stop-color="#ffd23a"/><stop offset="1" stop-color="#fff1a8"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffb020"/><stop offset="1" stop-color="#ff5a14"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe8"/><stop offset=".45" stop-color="#d9b25a"/>
      <stop offset=".55" stop-color="#8a6420"/><stop offset="1" stop-color="#f3d892"/>
    </linearGradient>
    <linearGradient id="chromeH" x1="0" x2="1">
      <stop offset="0" stop-color="#8a6420"/><stop offset=".5" stop-color="#fff4c8"/><stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <radialGradient id="dome" cx=".5" cy=".35" r=".7">
      <stop offset="0" stop-color="#5a2a10"/><stop offset=".7" stop-color="#1c0b05"/><stop offset="1" stop-color="#0d0503"/>
    </radialGradient>
    <radialGradient id="grille" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#ffcf6b"/><stop offset=".6" stop-color="#e0761a"/><stop offset="1" stop-color="#7a2a08"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><path d="M86 500 V230 A170 170 0 0 1 426 230 V500 Z"/></clipPath>
  </defs>

  <!-- cabinet -->
  <path d="M86 500 V230 A170 170 0 0 1 426 230 V500 Z" fill="url(#wood)"/>

  <!-- glowing outer arch + bubble-tube pilasters -->
  <g filter="url(#glow)">
    <path d="M112 498 V232 A144 144 0 0 1 400 232 V498" fill="none" stroke="url(#tube)" stroke-width="34" stroke-linecap="butt"/>
  </g>
  <path d="M112 498 V232 A144 144 0 0 1 400 232 V498" fill="none" stroke="#fff6cf" stroke-opacity=".55" stroke-width="6"/>
  <!-- bubbles -->
  <g fill="#fffbe6" fill-opacity=".9">
    <circle cx="112" cy="460" r="6"/><circle cx="112" cy="410" r="4.5"/><circle cx="112" cy="365" r="5.5"/><circle cx="112" cy="318" r="4"/>
    <circle cx="400" cy="440" r="5.5"/><circle cx="400" cy="392" r="4"/><circle cx="400" cy="345" r="6"/><circle cx="400" cy="300" r="4.5"/>
  </g>

  <!-- chrome inner frame -->
  <path d="M136 500 V236 A120 120 0 0 1 376 236 V500" fill="#2a1208" stroke="url(#chromeH)" stroke-width="8"/>

  <!-- dome window with record changer -->
  <path d="M150 300 V238 A106 106 0 0 1 362 238 V300 Z" fill="url(#dome)" stroke="url(#chrome)" stroke-width="6"/>
  <g filter="url(#glow)">
    <ellipse cx="256" cy="262" rx="78" ry="26" fill="#090403"/>
  </g>
  <ellipse cx="256" cy="262" rx="78" ry="26" fill="#120806" stroke="#3a2a22" stroke-width="2"/>
  <ellipse cx="256" cy="262" rx="58" ry="19" fill="none" stroke="#2c1e18" stroke-width="2"/>
  <ellipse cx="256" cy="262" rx="38" ry="12" fill="none" stroke="#2c1e18" stroke-width="2"/>
  <ellipse cx="256" cy="262" rx="18" ry="6" fill="#e2312a"/>
  <path d="M256 162 V190" stroke="url(#chromeH)" stroke-width="6"/>
  <path d="M190 210 A80 80 0 0 1 322 210" fill="none" stroke="#ffcc55" stroke-opacity=".35" stroke-width="4"/>

  <!-- title strip / selector band -->
  <rect x="146" y="306" width="220" height="40" rx="6" fill="url(#chrome)"/>
  <rect x="158" y="314" width="196" height="24" rx="3" fill="#f6ecd2"/>
  <g stroke="#b8402a" stroke-width="3">
    <path d="M168 320 H198 M168 330 H192 M212 320 H242 M212 330 H236 M256 320 H286 M256 330 H280 M300 320 H330 M300 330 H324"/>
  </g>

  <!-- speaker grille -->
  <rect x="150" y="356" width="212" height="144" fill="url(#grille)"/>
  <g clip-path="url(#body)" stroke="url(#chromeH)" stroke-width="7" fill="none">
    <path d="M150 380 Q256 350 362 380"/>
    <path d="M150 412 Q256 382 362 412"/>
    <path d="M150 444 Q256 414 362 444"/>
    <path d="M150 476 Q256 446 362 476"/>
  </g>
  <path d="M256 356 V500" stroke="url(#chromeH)" stroke-width="8"/>
  <rect x="150" y="356" width="212" height="144" fill="none" stroke="url(#chrome)" stroke-width="6"/>

  <!-- base plinth -->
  <rect x="80" y="486" width="352" height="20" rx="4" fill="url(#chromeH)"/>
</svg>
